name: Independent marketplace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MONGOMS_DISTRO: ubuntu-22.04
      MONGOMS_VERSION: 7.0.24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s ops -p 'test_*.py'
      - run: |
          for script in ops/*.sh; do bash -n "$script"; done
      - run: npm run api:contracts && git diff --exit-code docs/openapi.json
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: docker build -t expert-marketplace:ci .
