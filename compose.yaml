# LOCAL DEVELOPMENT ONLY. Do not expose this unauthenticated DB publicly.
services:
  mongo:
    image: mongo:7.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:27017:27017']
    volumes: ['market_mongo:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo: { condition: service_healthy }
    restart: 'no'
    entrypoint:
      [
        'mongosh',
        '--host',
        'mongo:27017',
        '--eval',
        "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }",
      ]
volumes:
  market_mongo:
