name: industryconnect
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--keyFile', '/run/mongo-key']
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?required}
    volumes:
      - mongo_data:/data/db
      - /opt/industryconnect/secrets/mongo-key:/run/mongo-key:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 30
  api:
    image: industryconnect:${RELEASE_TAG:?required}
    build: .
    restart: unless-stopped
    env_file: /opt/industryconnect/secrets/app.env
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      mongo: {condition: service_healthy}
  worker:
    image: industryconnect:${RELEASE_TAG:?required}
    restart: unless-stopped
    command: ['node', 'apps/api/dist/worker-main.js']
    env_file: /opt/industryconnect/secrets/app.env
    healthcheck: {disable: true}
    depends_on:
      mongo: {condition: service_healthy}
volumes:
  mongo_data:
